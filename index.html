let __pessoaBuscaTimer = null;
function debouncedPessoaBusca(valor){
  state.pessoaBusca = valor;
  state.pessoaVerTodas = false;
  clearTimeout(__pessoaBuscaTimer);
  __pessoaBuscaTimer = setTimeout(render, 300);
}
function editarPessoa(id){
  const pe = state.pessoas.find((x) => x.id === id);
  if(!pe) return;
  state.pessoa = { editingId: pe.id, name: pe.full_name, email: pe.email, active: pe.active };
  render();
  // A lista é longa: leva a pessoa até o formulário, senão parece que o botão
  // não fez nada (o formulário fica no topo da página).
  setTimeout(() => {
    const form = document.getElementById("formPessoa");
    if(form) form.scrollIntoView({ behavior:"smooth", block:"center" });
    const campo = document.querySelector('input[oninput*="state.pessoa.name"]');
    if(campo) campo.focus();
  }, 50);
}
async function excluirPessoa(id){
  const pe = state.pessoas.find((x) => x.id === id);
  if(!pe) return;
  if(!confirm('Excluir o cadastro de "'+pe.full_name+'" ('+pe.email+')?\n\n' +
    'A pessoa deixa de poder criar acesso. Se ela já tem acesso criado, ele continua funcionando — ' +
    'para bloquear alguém que já entra, use o interruptor em vez de excluir.')) return;
  const { error } = await sb.from("pessoas_cadastradas").delete().eq("id", id);
  if(error){ err("Não foi possível excluir: "+error.message); return; }
  if(state.pessoa.editingId === id) state.pessoa = { editingId:null, name:"", email:"", active:true };
  await refreshPessoas();
  ok("Cadastro excluído.");
  render();
}
function cancelarEdicaoPessoa(){ state.pessoa = { editingId: null, name: "", email: "", active: true }; render(); }
async function salvarPessoa(e){
  e.preventDefault();
  const p = state.pessoa;
  if(p.name.trim().length < 2) return err("Informe o nome completo."), false;
  if(!/^\S+@\S+\.\S+$/.test(p.email.trim())) return err("E-mail inválido."), false;
  const isNew = !p.editingId;
  const payload = { full_name: p.name.trim(), email: p.email.trim().toLowerCase(), active: p.active };
  const { error } = p.editingId
    ? await sb.from("pessoas_cadastradas").update(payload).eq("id", p.editingId)
    : await sb.from("pessoas_cadastradas").insert(payload);
  if(error){ err("Não foi possível salvar: "+error.message); return false; }
  state.pessoa = { editingId: null, name: "", email: "", active: true };
  await refreshPessoas(); ok(p.editingId ? "Pessoa atualizada." : "Pessoa cadastrada."); render();
  if(isNew && payload.active) callEmailService("convite_acesso", { nome: payload.full_name, email: payload.email });
  return false;
}
async function togglePessoa(id, active){
  const { error } = await sb.from("pessoas_cadastradas").update({ active }).eq("id", id);
  if(error) return err("Não foi possível atualizar: "+error.message);
  await refreshPessoas(); render();
}
async function criarDepartamento(e){
  e.preventDefault();
  const dp = state.departamento;
  if(dp.name.trim().length < 2) return err("Informe o nome do departamento."), false;
  const { error } = await sb.from("departments").insert({ name: dp.name.trim() });
  if(error){ err("Não foi possível criar o departamento: "+error.message); return false; }
  state.departamento = { name: "" };
  await refreshDepartments(); ok("Departamento criado."); render();
  return false;
}
async function excluirDepartamento(id, name){
  if(!confirm('Excluir o departamento "'+name+'"? Isso só funciona se ele não estiver em uso em nenhuma solicitação, tipo ou pessoa.')) return;
  const { error } = await sb.from("departments").delete().eq("id", id);
  if(error){ err("Não foi possível excluir: pode haver solicitações ou tipos usando este departamento."); return; }
  await refreshDepartments(); ok("Departamento excluído."); render();
}
async function definirNivelAcesso(userId, nivel){
  if(!ACCESS_LEVELS.some((l) => l.value === nivel)) return err("Nível inválido.");
  // Remove qualquer nível anterior dessa pessoa e grava só o novo (um por pessoa).
  for(const l of ACCESS_LEVELS){
    if(l.value !== nivel && state.allRoles.some((r) => r.user_id === userId && r.role === l.value)){
      await sb.from("user_roles").delete().eq("user_id", userId).eq("role", l.value);
    }
  }
  const { error } = await sb.from("user_roles").insert({ user_id: userId, role: nivel });
  if(error){ err("Não foi possível salvar o nível de acesso."); return; }
  await refreshRoles();
  const pessoa = state.profiles.find((p) => p.id === userId);
  ok('Nível de "'+((pessoa && pessoa.full_name) || "pessoa")+'" definido como '+ACCESS_LEVEL_LABEL[nivel]+".");
  render();
}

async function mesclarPerfis(keepId, removeId){
  if(!keepId || !removeId) return err("Selecione os dois perfis.");
  if(keepId === removeId) return err("Selecione dois perfis diferentes.");
  const keep = state.profiles.find((p) => p.id === keepId);
  const remove = state.profiles.find((p) => p.id === removeId);
  if(!keep || !remove) return err("Perfil não encontrado.");
  if(!confirm('Mesclar "'+remove.full_name+'" ('+remove.email+') dentro de "'+keep.full_name+'" ('+keep.email+')?\n\n'+
    'Tudo que hoje está com '+remove.full_name+' (solicitações, comentários, tipos, tarefas) passa para '+keep.full_name+
    ', e o perfil "'+remove.full_name+'" é apagado.\n\nEssa ação não pode ser desfeita.')) return;

  try{
    async function reassign(collection, field){
      const snap = await fbDb.collection(collection).where(field, "==", removeId).get();
      for(let i=0;i<snap.docs.length;i+=400){
        const group = snap.docs.slice(i, i+400);
        const batch = fbDb.batch();
        group.forEach((d) => batch.set(d.ref, { [field]: keepId }, { merge:true }));
        await batch.commit();
      }
      return snap.docs.length;
    }

    const counts = {
      "solicitações (responsável)": await reassign("requests", "assignee_id"),
      "solicitações (solicitante)": await reassign("requests", "requester_id"),
      "comentários": await reassign("request_comments", "author_id"),
      "tipos (responsável)": await reassign("request_types", "owner_id"),
      "tipos (cadastro fiscal)": await reassign("request_types", "fiscal_assignee_id"),
      "tarefas da agenda": await reassign("personal_tasks", "user_id"),
    };

    const rolesSnap = await fbDb.collection("user_roles").where("user_id","==",removeId).get();
    for(const d of rolesSnap.docs){
      const role = d.data().role;
      await fbDb.collection("user_roles").doc(keepId+"_"+role).set({ user_id: keepId, role }, { merge:true });
      await d.ref.delete();
    }

    await fbDb.collection("profiles").doc(removeId).delete();

    const total = Object.values(counts).reduce((a,b) => a+b, 0);
    await loadCore();
    ok('Mesclado: '+total+' registro(s) movidos de "'+remove.full_name+'" para "'+keep.full_name+'". Perfil duplicado removido.');
    render();
  } catch(e){
    err("Erro ao mesclar perfis: "+(e.message || e));
  }
}

/* ============================ Relatórios ============================ */
const PERIODS = [
  { value:"7", label:"Últimos 7 dias" },
  { value:"30", label:"Últimos 30 dias" }, { value:"90", label:"Últimos 90 dias" },
  { value:"365", label:"Últimos 12 meses" }, { value:"todos", label:"Todo o período" },
  { value:"custom", label:"Período específico…" },
];
// Diferença em dias entre a conclusão e o prazo:
//  negativo = concluída ANTES do prazo (adiantada)
//  zero     = concluída exatamente no prazo
//  positivo = concluída DEPOIS do prazo (atrasada)
//  null     = não dá para calcular (sem prazo ou ainda não concluída)
function desvioPrazo(r){
  if(!r.completed_at || !r.due_date) return null;
  const concl = new Date(String(r.completed_at).slice(0,10)+"T12:00:00").getTime();
  const prazo = new Date(String(r.due_date).slice(0,10)+"T12:00:00").getTime();
  return Math.round((concl - prazo)/86400000);
}
function desvioLabel(d){
  if(d === null) return "";
  if(d === 0) return "0 (no prazo)";
  return (d > 0 ? "+" : "") + d;
}
function relatorioRows(){
  let list = state.requests.slice();
  const { relPeriod, relDep, relFrom, relTo } = state.filters;
  if(relPeriod === "custom"){
    if(relFrom) list = list.filter((r) => String(r.created_at).slice(0,10) >= relFrom);
    if(relTo) list = list.filter((r) => String(r.created_at).slice(0,10) <= relTo);
  } else if(relPeriod !== "todos"){
    const limit = Date.now() - Number(relPeriod)*86400000;
    list = list.filter((r) => new Date(r.created_at).getTime() >= limit);
  }
  if(relDep !== "todos") list = list.filter((r) => r.target_department_id === relDep || r.requester_department_id === relDep);
  return list;
}
function viewRelatorios(){
  const rows = relatorioRows();
  const open = rows.filter((r) => r.status !== "concluida" && r.status !== "cancelada");
  const done = rows.filter((r) => r.status === "concluida");
  const overdue = open.filter((r) => (daysUntil(r.due_date) ?? 1) < 0);
  const onTime = done.filter((r) => !r.due_date || !r.completed_at || daysBetween(r.completed_at, r.due_date+"T23:59:59") >= 0);
  const avgDays = done.length ? done.reduce((s,r) => s + (r.completed_at ? daysBetween(r.created_at, r.completed_at) : 0), 0)/done.length : 0;

  const byStatus = STATUS_ORDER.map((s) => ({ key:s, label:STATUS_LABEL[s], count: rows.filter((r) => r.status === s).length }));
  const maxStatus = Math.max(1, ...byStatus.map((s) => s.count));
  const byPriority = Object.keys(PRIORITY_LABEL).map((p) => ({ key:p, label:PRIORITY_LABEL[p], count: rows.filter((r) => r.priority === p).length }));
  const maxPrio = Math.max(1, ...byPriority.map((p) => p.count));
  const byDepartment = state.departments.map((d) => {
    const l = rows.filter((r) => r.target_department_id === d.id);
    return { name:d.name, total:l.length,
      open: l.filter((r) => r.status !== "concluida" && r.status !== "cancelada").length,
      overdue: l.filter((r) => r.status !== "concluida" && r.status !== "cancelada" && (daysUntil(r.due_date) ?? 1) < 0).length };
  }).filter((d) => d.total > 0).sort((a,b) => b.total - a.total);

  const map = new Map();
  const hojeISO = todayISO();
  rows.forEach((r) => {
    const key = r.assignee_id || "sem";
    const e = map.get(key) || { total:0, open:0, done:0, atrasadas:0, concluidasComAtraso:0, somaDesvio:0, comDesvio:0 };
    e.total++;
    if(r.status === "concluida") e.done++; else if(r.status !== "cancelada") e.open++;
    // Em atraso agora (ainda aberta e passou do prazo)
    if(r.status !== "concluida" && r.status !== "cancelada" && r.due_date && String(r.due_date) < hojeISO) e.atrasadas++;
    const desvio = desvioPrazo(r);
    if(desvio !== null){
      e.somaDesvio += desvio; e.comDesvio++;
      if(desvio > 0) e.concluidasComAtraso++;
    }
    map.set(key, e);
  });
  const byAssignee = [...map.entries()].map(([id,v]) => ({
    name: id === "sem" ? "Sem responsável" : nameById(id), ...v,
    mediaDesvio: v.comDesvio ? (v.somaDesvio/v.comDesvio) : null,
  })).sort((a,b) => b.total - a.total).slice(0,8);

  const periodOpts = PERIODS.map((p) => '<option value="'+p.value+'"'+(p.value===state.filters.relPeriod?" selected":"")+'>'+p.label+'</option>').join("");
  const depOpts = '<option value="todos">Todos os departamentos</option>'+state.departments.map((d) => '<option value="'+d.id+'"'+(d.id===state.filters.relDep?" selected":"")+'>'+esc(d.name)+'</option>').join("");

  const kpi = (label, value, hint, tone) => '<div class="rounded-xl border border-border bg-card p-4 shadow-card">'+
    '<p class="text-xs font-medium tracking-wide text-muted-foreground uppercase">'+label+'</p>'+
    '<p class="mt-2 font-display text-3xl font-bold '+(tone==="destructive"?"text-destructive":"")+'">'+value+'</p>'+
    '<p class="mt-1 text-xs text-muted-foreground">'+hint+'</p></div>';
  const panel = (title, inner, cls) => '<section class="rounded-xl border border-border bg-card p-5 shadow-card '+(cls||"")+'">'+
    '<h2 class="font-display text-sm font-semibold">'+title+'</h2><div class="mt-4">'+inner+'</div></section>';
  const table = (head, body, empty) => body.length === 0
    ? '<p class="py-6 text-center text-sm text-muted-foreground">'+empty+'</p>'
    : '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-border text-left text-xs text-muted-foreground">'+
      head.map((h) => '<th class="pb-2 font-medium">'+h+'</th>').join("")+'</tr></thead><tbody>'+
      body.map((r) => '<tr class="border-b border-border/60 last:border-0">'+r.map((c) => '<td class="py-2 pr-3 tabular-nums first:font-medium">'+esc(c)+'</td>').join("")+'</tr>').join("")+
      '</tbody></table></div>';

  const statusBars = '<ul class="space-y-3">'+byStatus.map((s) => '<li class="flex items-center gap-3">'+
    '<span class="size-2 rounded-full '+STATUS_DOT[s.key]+'"></span><span class="w-32 text-sm">'+s.label+'</span>'+
    '<div class="h-2 flex-1 overflow-hidden rounded-full bg-secondary"><div class="h-full rounded-full '+STATUS_DOT[s.key]+'" style="width:'+(s.count/maxStatus*100)+'%"></div></div>'+
    '<span class="w-8 text-right text-sm tabular-nums">'+s.count+'</span></li>').join("")+'</ul>';
  const prioBars = '<ul class="space-y-3">'+byPriority.map((p) => '<li class="flex items-center gap-3">'+
    '<span class="w-32 text-sm">'+p.label+'</span>'+
    '<div class="h-2 flex-1 overflow-hidden rounded-full bg-secondary"><div class="h-full rounded-full bg-primary" style="width:'+(p.count/maxPrio*100)+'%"></div></div>'+
    '<span class="w-8 text-right text-sm tabular-nums">'+p.count+'</span></li>').join("")+'</ul>';

  return '<div><div class="flex flex-wrap items-end justify-between gap-4">'+
    '<div><h1 class="text-3xl font-bold">Relatórios</h1>'+
    '<p class="mt-1 text-sm text-muted-foreground">Indicadores gerados a partir das solicitações da central de serviços.</p></div>'+
    '<div class="flex flex-wrap items-center gap-2">'+
      '<select class="inp w-48" onchange="state.filters.relPeriod=this.value;render()">'+periodOpts+'</select>'+
      (state.filters.relPeriod === "custom"
        ? '<input class="inp w-40" type="date" title="Data inicial" value="'+esc(state.filters.relFrom)+'" onchange="state.filters.relFrom=this.value;render()" />'+
          '<span class="text-xs text-muted-foreground">até</span>'+
          '<input class="inp w-40" type="date" title="Data final" value="'+esc(state.filters.relTo)+'" onchange="state.filters.relTo=this.value;render()" />'
        : "")+
      '<select class="inp w-56" onchange="state.filters.relDep=this.value;render()">'+depOpts+'</select>'+
      '<button class="btn btn-outline" onclick="exportCsv()">'+I.download+' Exportar CSV</button>'+
    '</div></div>'+
    (["todos","365"].includes(state.filters.relPeriod) ? '<p class="mt-3 rounded-lg border border-border bg-surface px-3 py-2 text-xs text-muted-foreground">'+
      'Use "Todo o período" e "Últimos 12 meses" com moderação: eles carregam o histórico completo do banco, o que pesa mais e, '+
      'se usado com muita frequência ao longo do dia, pode deixar o app fora do ar até o dia seguinte (limite gratuito do banco de dados).</p>' : "")+
    '<div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-5">'+
      kpi("Solicitações", rows.length, "no período")+
      kpi("Em aberto", open.length, "fora de concluída/cancelada")+
      kpi("Em atraso", overdue.length, "prazo vencido", "destructive")+
      kpi("Tempo médio", done.length ? avgDays.toFixed(1)+" d" : "—", "da abertura à conclusão")+
      kpi("Dentro do prazo", done.length ? Math.round(onTime.length/done.length*100)+"%" : "—", "das concluídas")+
    '</div>'+
    '<div class="mt-6 grid gap-4 lg:grid-cols-2">'+
      panel("Distribuição por status", statusBars)+
      panel("Distribuição por prioridade", prioBars)+
      panel("Carga por departamento solicitado", table(["Departamento","Total","Abertas","Atrasadas"], byDepartment.map((d) => [d.name,d.total,d.open,d.overdue]), "Nenhuma solicitação no período."))+
      panel("Produtividade por responsável", table(
        ["Responsável","Total","Abertas","Concluídas","Em atraso","Concluídas com atraso","Média vs. prazo"],
        byAssignee.map((a) => [
          a.name, a.total, a.open, a.done, a.atrasadas, a.concluidasComAtraso,
          a.mediaDesvio === null ? "—" : (a.mediaDesvio > 0 ? "+" : "") + a.mediaDesvio.toFixed(1) + " d",
        ]), "Nenhuma solicitação no período."))+
    '</div>'+
    panel("Solicitações em atraso", table(["Código","Título","Departamento","Responsável","Prazo","Dias de atraso"],
      overdue.slice().sort((a,b) => (a.due_date||"").localeCompare(b.due_date||"")).map((r) => [
        "#"+pad4(r.code), r.title, depById(r.target_department_id),
        r.assignee_id ? nameById(r.assignee_id) : "Sem responsável", formatDate(r.due_date),
        "+" + Math.max(1, Math.round((new Date(todayISO()+"T12:00:00") - new Date(String(r.due_date).slice(0,10)+"T12:00:00"))/86400000)),
      ]), "Nenhuma solicitação em atraso. 🎉"), "mt-4")+
    panel("Cumprimento de prazo (concluídas)", table(["Código","Título","Responsável","Prazo","Concluída em","Dias vs. prazo","Situação"],
      done.filter((r) => desvioPrazo(r) !== null)
        .sort((a,b) => desvioPrazo(b) - desvioPrazo(a))
        .slice(0, 40)
        .map((r) => {
          const d = desvioPrazo(r);
          return ["#"+pad4(r.code), r.title, r.assignee_id ? nameById(r.assignee_id) : "—",
            formatDate(r.due_date), formatDate(r.completed_at), desvioLabel(d), d > 0 ? "Atrasada" : "No prazo"];
        }), "Nenhuma solicitação concluída com prazo definido no período."), "mt-4")+
  '</div>';
}
function exportCsv(){
  const rows = relatorioRows();
  const hojeISO = todayISO();
  const header = ["codigo","titulo","status","prioridade","solicitante","responsavel","departamento_solicitado","criada_em","prazo","concluida_em","situacao_prazo","dias_vs_prazo"];
  const lines = rows.map((r) => {
    const desvio = desvioPrazo(r);
    let situacao = "";
    if(desvio !== null) situacao = desvio > 0 ? "Atrasada" : "No prazo";
    else if(r.status !== "concluida" && r.status !== "cancelada" && r.due_date){
      situacao = String(r.due_date) < hojeISO ? "Em atraso (em aberto)" : "Dentro do prazo (em aberto)";
    }
    return [
      pad4(r.code), r.title, STATUS_LABEL[r.status], PRIORITY_LABEL[prioridadeDe(r)],
      nameById(r.requester_id), r.assignee_id ? nameById(r.assignee_id) : "",
      depById(r.target_department_id), formatDate(r.created_at),
      r.due_date ? formatDate(r.due_date) : "", r.completed_at ? formatDate(r.completed_at) : "",
      situacao, desvio === null ? "" : desvio,
    ].map((v) => '"'+String(v).replace(/"/g,'""')+'"').join(";");
  });
  const blob = new Blob(["\uFEFF"+header.join(";")+"\n"+lines.join("\n")], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "relatorio-solicitacoes-"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); URL.revokeObjectURL(url);
}

/* ============================ Boot ============================ */
async function boot(){
  const { data } = await sb.auth.getSession();
  state.user = data.session ? data.session.user : null;
  await loadCore();
  state.ready = true;
  render();
}
sb.auth.onAuthStateChange((event, session) => {
  const next = session ? session.user : null;
  if((next && next.id) !== (state.user && state.user.id)){ state.user = next; loadCore().then(render); }
});
boot();
</script>
